syntax = "proto3";

package battle;

import "character.proto";

message BattleAction {
  int32 char_idx = 1;
  int32 target_idx = 2;
  int32 action_kind = 3;
}

message BattleCharacter {
  int32 character_id = 1;
  int32 level = 2;
  int32 rank = 3;
  int32 femdom_lv = 4;
  repeated int32 skill_lv = 5;
  character.Rune rune = 6;
}

message BattleResult {
  int32 dead = 1;
  int32 wave = 5;
  int32 max_damage = 6;
  int32 max_damage_char_id = 7;
  int32 total_damage = 8;
  bool retreat = 11;
  repeated BattleTurn turns = 14;
}

message BattleTurn {
  repeated BattleAction actions = 1;
}
