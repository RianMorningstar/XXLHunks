syntax = "proto3";

package social;

message UserExtraInfo {
  int32 flag_info = 1;
  int32 age = 2;
  int32 sex_index = 3;
  int32 height = 4;
  int32 weight = 5;
  int32 blood_type_index = 6;
  int32 star_sign_index = 7;
  int32 flag_mbti = 8;
  int32 relationship_state_index = 9;
  int32 body_shape_index = 10;
}

message UserExtraInfoResponse {
  int32 code = 1;
  UserExtraInfo info = 2;
}
